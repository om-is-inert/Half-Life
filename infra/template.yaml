AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Half-Life: AI-Powered Android Hardware Triage
  SAM template — deploys S3, DynamoDB, API Gateway, and all Lambda functions.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
    Description: Deployment stage

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: Days to retain raw logs in S3 and CloudWatch

  BedrockModelId:
    Type: String
    Default: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    Description: Bedrock model ID for Claude

  PresignedUrlExpiry:
    Type: Number
    Default: 900
    Description: Presigned URL expiry in seconds (default 15 min)

# ---------------------------------------------------------------------------
# Globals
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref JobsTable
        S3_BUCKET: !Ref RawLogsBucket
        AWS_REGION_NAME: !Ref AWS::Region
    Layers:
      - !Ref SharedLayer

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── Shared Lambda Layer (utils.py) ────────────────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "half-life-shared-${Stage}"
      Description: Shared utilities for Half-Life Lambdas
      ContentUri: ../lambdas/shared/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # ── S3 Raw Logs Bucket ────────────────────────────────────────────────────
  RawLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "half-life-raw-logs-${AWS::AccountId}-${Stage}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteRawLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: "raw-logs/"
            Function: !GetAtt PreprocessorFunction.Arn

  RawLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawLogsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${RawLogsBucket}"
              - !Sub "arn:aws:s3:::${RawLogsBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # ── DynamoDB Table ────────────────────────────────────────────────────────
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "HalfLifeJobs-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # ── API Gateway ───────────────────────────────────────────────────────────
  HalfLifeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "half-life-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # ── Lambda: GetUploadUrl ──────────────────────────────────────────────────
  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-get-upload-url-${Stage}"
      CodeUri: ../lambdas/get_upload_url/
      Handler: handler.handler
      Description: Generate presigned S3 PUT URL and create DynamoDB job record
      Environment:
        Variables:
          PRESIGNED_EXPIRES: !Ref PresignedUrlExpiry
      Policies:
        - S3WritePolicy:
            BucketName: !Ref RawLogsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
      Events:
        PostUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /get-upload-url
            Method: POST
        OptionsUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /get-upload-url
            Method: OPTIONS

  # ── Lambda: Preprocessor ─────────────────────────────────────────────────
  PreprocessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-preprocessor-${Stage}"
      CodeUri: ../lambdas/preprocessor/
      Handler: handler.handler
      Timeout: 600
      MemorySize: 1024
      Description: S3-triggered log cleaner and chunker
      Environment:
        Variables:
          BEDROCK_INVOKE_FUNCTION: !GetAtt BedrockInvokeFunction.Arn
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref RawLogsBucket
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref BedrockInvokeFunction

  PreprocessorS3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreprocessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::half-life-raw-logs-${AWS::AccountId}-${Stage}"

  # ── Lambda: BedrockInvoke ─────────────────────────────────────────────────
  BedrockInvokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-bedrock-invoke-${Stage}"
      CodeUri: ../lambdas/bedrock_invoke/
      Handler: handler.handler
      Timeout: 600
      MemorySize: 512
      Description: Calls Claude via Bedrock for Android log diagnosis
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          FORMATTER_FUNCTION: !GetAtt FormatterFunction.Arn
          BEDROCK_MAX_RETRIES: "3"
          BEDROCK_MAX_TOKENS: "2048"
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref FormatterFunction
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}"

  # ── Lambda: Formatter ─────────────────────────────────────────────────────
  FormatterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-formatter-${Stage}"
      CodeUri: ../lambdas/formatter/
      Handler: handler.handler
      Description: Translates Bedrock JSON into human-readable report
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable

  # ── Lambda: GetReport ─────────────────────────────────────────────────────
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-get-report-${Stage}"
      CodeUri: ../lambdas/get_report/
      Handler: handler.handler
      Description: Fetch job status and diagnosis report by job ID
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
      Events:
        GetReport:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /report/{jobId}
            Method: GET
        OptionsReport:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /report/{jobId}
            Method: OPTIONS

  # ── CloudWatch Alarms ─────────────────────────────────────────────────────
  PreprocessorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "half-life-preprocessor-errors-${Stage}"
      AlarmDescription: "Preprocessor Lambda errors > 5 in 5 minutes"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreprocessorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  BedrockInvokeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "half-life-bedrock-errors-${Stage}"
      AlarmDescription: "BedrockInvoke Lambda errors > 3 in 5 minutes"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref BedrockInvokeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  BedrockThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "half-life-bedrock-throttles-${Stage}"
      AlarmDescription: "Bedrock Lambda throttles > 2 in 5 minutes (cost guard)"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref BedrockInvokeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiBaseUrl:
    Description: "API Gateway base URL — set as HALFLIFE_API_URL in your environment"
    Value: !Sub "https://${HalfLifeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  RawLogsBucketName:
    Description: "S3 bucket for raw Android logs"
    Value: !Ref RawLogsBucket

  JobsTableName:
    Description: "DynamoDB jobs table name"
    Value: !Ref JobsTable

  PreprocessorFunctionArn:
    Description: "Preprocessor Lambda ARN"
    Value: !GetAtt PreprocessorFunction.Arn

  BedrockInvokeFunctionArn:
    Description: "Bedrock Invoke Lambda ARN"
    Value: !GetAtt BedrockInvokeFunction.Arn
