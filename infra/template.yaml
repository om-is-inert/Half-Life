AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Half-Life: AI-Powered Android Hardware Triage
  v2 — WebUSB + Deterministic Lambda (no Bedrock in hot path)

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30          # well under API Gateway's 29s hard limit
    MemorySize: 256
    Architectures: [x86_64]
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref JobsTable
        AWS_REGION_NAME: !Ref AWS::Region
    Layers:
      - !Ref SharedLayer

Resources:

  # ── Shared Lambda Layer ───────────────────────────────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "half-life-shared-${Stage}"
      ContentUri: ../lambdas/shared/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # ── DynamoDB ──────────────────────────────────────────────────────────────────
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "HalfLifeJobs-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: jobId, AttributeType: S }
      KeySchema:
        - { AttributeName: jobId, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── API Gateway ───────────────────────────────────────────────────────────────
  HalfLifeApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "half-life-api-${Stage}"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin:  "'*'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

  # ── Lambda: Analyze (deterministic parser, <100ms) ────────────────────────────
  AnalyzeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-analyze-${Stage}"
      CodeUri: ../lambdas/analyze/
      Handler: handler.handler
      Description: Deterministic Android log parser — battery wear, wakelocks, CPU, thermal
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
      Events:
        PostAnalyze:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /analyze
            Method: POST
        OptionsAnalyze:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /analyze
            Method: OPTIONS

  # ── Lambda: GetReport (job ID lookup, returning users) ────────────────────────
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "half-life-get-report-${Stage}"
      CodeUri: ../lambdas/get_report/
      Handler: handler.handler
      Description: Fetch stored diagnosis report by job ID
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
      Events:
        GetReport:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /report/{jobId}
            Method: GET
        OptionsReport:
          Type: Api
          Properties:
            RestApiId: !Ref HalfLifeApi
            Path: /report/{jobId}
            Method: OPTIONS

  # ── CloudWatch Alarms ─────────────────────────────────────────────────────────
  AnalyzeErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "half-life-analyze-errors-${Stage}"
      AlarmDescription: "Analyze Lambda errors > 5 in 5 minutes"
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - { Name: FunctionName, Value: !Ref AnalyzeFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AnalyzeThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "half-life-analyze-throttles-${Stage}"
      AlarmDescription: "Analyze Lambda throttles > 10 in 5 minutes"
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - { Name: FunctionName, Value: !Ref AnalyzeFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiBaseUrl:
    Description: "Set this as VITE_API_URL in your Amplify environment variables"
    Value: !Sub "https://${HalfLifeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"

  JobsTableName:
    Description: "DynamoDB jobs table name"
    Value: !Ref JobsTable

  AnalyzeFunctionArn:
    Description: "Analyze Lambda ARN"
    Value: !GetAtt AnalyzeFunction.Arn
